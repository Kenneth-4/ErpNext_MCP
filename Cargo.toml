[package]
name = "erpnext-mcp"
version = "0.1.0"
edition = "2024"
authors = ["Kenneth Cubian <kenneth@hti.ph>"]
description = "High-performance Model Context Protocol (MCP) server for ERPNext and Frappe Framework written in Rust"
license = "MIT"

[dependencies]
# MCP SDK
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# HTTP Client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization & Schema
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Utilities
urlencoding = "2.1"
dotenvy = "0.15"

[dev-dependencies]
wiremock = "0.6"
